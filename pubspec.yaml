name: uts_aplikasi_rekomendasi_destinasi_wisata_kuliner_lokal
description: "LokaNusantara - Aplikasi Rekomendasi Destinasi Wisata dan Kuliner Lokal berbasis Flutter dengan Asynchronous Programming dan Data Persistence (Shared Preferences & Read/Write Files)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - lib/assets/data/
